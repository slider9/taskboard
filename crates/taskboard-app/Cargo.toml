[package]
name = "taskboard-app"
version.workspace = true
edition = "2024"
license.workspace = true
description = "The task board's native macOS app (GPUI), a client of taskboardd"

[[bin]]
name = "taskboard-app"
path = "src/main.rs"

[features]
# Slate renders its shots in the app (GPUI's render_to_image), with no Screen Recording
# permission, and a release build honours SLATE=1 too (src/hidden.rs). Dev only.
snapshot = ["gpui-kit/test-support", "slate/render"]

[dev-dependencies]
gpui-kit = { version = "0.7", default-features = false, features = ["test-support"] }

# build.rs: the Windows app icon.
[build-dependencies]
embed-resource = "3"

[dependencies]
taskboardd.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true
gpui-kit = { version = "0.7", default-features = false }
async-channel = "2"
# `slate shoot` / `slate drive` run the app hidden below the desktop, never focused (src/hidden.rs,
# scripts/slate.sh, which installs the `slate` command at this same rev).
slate = { git = "https://github.com/mrgnhnt96/slate", rev = "34b9471f4ce2828733589d8377336043ff47eba2" }
libc = "0.2"
# updater (src/updater.rs): the downloaded DMG's sha256
ring = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }

# src/win.rs: the startup entry and link scheme (registry), the daemon's supervisor (processes,
# named mutexes and events) and the pipe a second launch hands its links over on.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

# install (src/install.rs): register the daemon's LaunchAgent with SMAppService
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
