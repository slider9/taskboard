[package]
name = "taskboardd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The task board daemon: the API, the runner that starts Claude terminals in Midna, and the Midna sync"

[lib]
name = "taskboardd"
path = "src/lib.rs"

[[bin]]
name = "taskboardd"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
futures-util = { version = "0.3", default-features = false }
rusqlite = { version = "0.37", features = ["bundled", "serde_json", "hooks", "serialize"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ureq.workspace = true
clap.workspace = true
toml = "0.8"
shlex = "1"
regex.workspace = true
rand = "0.8"
parking_lot = "0.12"
mime_guess = "2"
dirs = "5"
once_cell.workspace = true
libc = "0.2"
# export.rs: the debug bundle is a deflated zip, its logs scrubbed of the board's own strings.
flate2 = "1"
crc32fast = "1"
aho-corasick = "1"
# util::canonical: real paths without Windows' `\\?\`.
dunce = "1"

# apporigin.rs: the app socket's peer is checked against the app's code signature.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
# midna.rs: Midna's socket on Windows 10 1803+ is an AF_UNIX socket at a path, as on macOS (Midna's own
# Windows build uses the same crate).
uds_windows = "1.2"
# proc.rs: a command's process tree as a job object, whether this process has a console, and the
# daemon's stop event. slot_ageing.rs: free disk. instance.rs: the data folder's lock.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
